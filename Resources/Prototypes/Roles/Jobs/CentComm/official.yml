      department: Command
      time: 15h # 15 hours
    - !type:OverallPlaytimeRequirement
      time: 140h #140 hrs # Corvax-RoleTime
  #setPreference: false
  startingGear: CentcommGear
  icon: "JobIconNanotrasen"
